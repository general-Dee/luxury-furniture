name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholder values so `next build` can compile — every route that
          # touches Firebase Admin or reads NEXT_PUBLIC_* config is force-dynamic
          # and lazily initialized (see src/lib/firebase/admin.ts), so none of
          # these are actually parsed/used during the build itself. Real
          # secrets are only required at runtime on Vercel.
          NEXT_PUBLIC_FIREBASE_API_KEY: build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: build-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: build-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: build-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
          NEXT_PUBLIC_FIREBASE_APP_ID: build-placeholder
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: build-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
