<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:var(--space-6);margin-bottom:var(--space-6);border-bottom:1px solid var(--color-divider);padding-bottom:var(--space-3);">
  <h1 style="text-transform:uppercase;margin:0;font-size:22px;">Admin</h1>
  <nav style="display:flex;gap:var(--space-4);font-size:14px;">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
      <span onClick="{{ it.go }}" style="color:{{ it.color }};font-weight:{{ it.weight }};cursor:pointer;">{{ it.label }}</span>
    </sc-for>
  </nav>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;dashboard&quot;, &quot;options&quot;: [&quot;dashboard&quot;,&quot;products&quot;,&quot;categories&quot;,&quot;orders&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;nav&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(key: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active;
    const navFn = this.props.nav;
    const tabs = [
      { key: 'dashboard', label: 'Dashboard' },
      { key: 'products', label: 'Products' },
      { key: 'categories', label: 'Categories' },
      { key: 'orders', label: 'Orders' },
    ];
    const items = tabs.map(t => ({
      label: t.label,
      color: t.key === active ? 'var(--color-text)' : 'color-mix(in srgb, var(--color-text) 60%, transparent)',
      weight: t.key === active ? '600' : '400',
      go: () => navFn && navFn(t.key),
    }));
    return { items };
  }
}
</script>
</body>
</html>
